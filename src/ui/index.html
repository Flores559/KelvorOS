<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KelvorOS</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#0f1115;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .card{
      width:700px;
      text-align:center;
      padding:50px;
      border-radius:20px;
      background:#181b22;
      box-shadow:0 0 30px rgba(255,0,0,.25);
    }

    h1{
      color:#ff2d2d;
      font-size:48px;
    }

    h2{
      margin-top:15px;
      color:#ccc;
    }

    p{
      margin-top:30px;
      color:#999;
      font-size:18px;
    }

    .status{
      margin-top:35px;
      display:inline-block;
      background:#ff2d2d;
      padding:12px 30px;
      border-radius:50px;
      font-weight:bold;
    }
  </style>
</head>

<body>

<div class="card">

<h1>KelvorOS</h1>

<h2>Voice Provider v2.6</h2>

<p>
Welcome back, JD.
</p>

<div class="status">
ONLINE
</div>

</div>

</body>
</html>
